[package]
name = "safeclone"
version = "0.1.0"
edition = "2021"
description = "Fail-closed foundation for creating policy-relative sanitized workspace clones"
license = "Apache-2.0"
publish = false

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
cbor4ii = { version = "=1.2.2", default-features = false, features = ["use_alloc"] }
ctutils = { version = "=0.4.2", default-features = false }
data-encoding = { version = "=2.11.0", default-features = false, features = ["alloc"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
regex = "=1.13.1"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }
